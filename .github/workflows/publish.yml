name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC) and provenance.
  id-token: write

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            smoke-consumer/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification gate
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
        run: pnpm verify:release

      # Requires this repository to be configured as a trusted publisher for
      # eslint-plugin-anti-slop on npmjs.com (no NPM_TOKEN needed). pnpm >= 10.9
      # exchanges the workflow OIDC token automatically.
      - name: Publish with provenance
        run: pnpm publish --provenance --access public --no-git-checks
