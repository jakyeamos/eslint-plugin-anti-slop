[[quality_runner.gates]]
id = "security_dependency_audit"
command = "pnpm dependency:security:required"
ecosystem = "node"
source = "pnpm-lock.yaml"
owner = "repository"
required = true
severity = "blocker"

[[quality_runner.gates]]
id = "environment_contract"
command = "node scripts/check_environment_contract.mjs"
ecosystem = "node"
source = "scripts/check_environment_contract.mjs"
owner = "repository"
required = true
severity = "blocker"
mutating_risk = "safe"

[quality_runner]
default_profile = "default"
required_capabilities = ["formatter", "lint", "typecheck", "tests", "build", "dead_code", "runtime_smoke", "pre_pr", "pre_cr"]
